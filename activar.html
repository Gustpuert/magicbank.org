<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Activación MagicBank</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Arial;
background:#070C2A;
color:white;
text-align:center;
padding:40px;
}

.card{
background:#0f172a;
padding:30px;
border-radius:12px;
max-width:500px;
margin:auto;
}

.btn{
background:#D6B15A;
color:black;
padding:12px;
border-radius:8px;
cursor:pointer;
margin-top:15px;
display:block;
}
</style>
</head>

<body>

<div class="card">

<h2>Activando tu acceso...</h2>

<p id="status">Validando información...</p>

<div id="manual" style="display:none;">

<p><strong>Correo:</strong></p>
<p id="email"></p>

<p><strong>Código de acceso:</strong></p>
<p id="token"></p>

<div class="btn" onclick="copiar()">Copiar acceso</div>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const token = params.get("token");
const email = params.get("email");

document.getElementById("email").innerText = email;
document.getElementById("token").innerText = token;

// 🔥 VALIDACIÓN REAL CON BACKEND
fetch("https://magic-bank-backend-production-713e.up.railway.app/api/validate-token", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
token: token,
email: email
})
})
.then(res => res.json())
.then(data => {

if(data.valid){

document.getElementById("status").innerText = "Acceso validado. Redirigiendo...";

// 🔥 REDIRECCIÓN AUTOMÁTICA
setTimeout(() => {
window.location.href = `https://magic-bank-backend-production-713e.up.railway.app/access/${token}`;
}, 1500);

}else{

document.getElementById("status").innerText = "Validación manual requerida";
document.getElementById("manual").style.display = "block";

}

})
.catch(err => {

document.getElementById("status").innerText = "Error de conexión";
document.getElementById("manual").style.display = "block";

});

// COPIAR
function copiar(){
navigator.clipboard.writeText(`Correo: ${email}\nToken: ${token}`);
alert("Copiado");
}

</script>

</body>
</html>
