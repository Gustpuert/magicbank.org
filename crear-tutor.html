<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crear Tutor MagicBank</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Arial;
background:#f4f4f8;
margin:0;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
color:#5b4ee6;
}

input, textarea{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:20px;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#5b4ee6;
color:#fff;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;
width:100%;
}

</style>
</head>

<body>

<div class="container">

<h1>Crear tu Tutor Personalizado</h1>

<p>
En MagicBank podemos crear un tutor exactamente como lo necesitas.
</p>

<form action="mailto:magicbankia@gmail.com" method="post" enctype="text/plain">

<input type="text" name="Nombre" placeholder="Nombre completo" required>

<input type="email" name="Correo" placeholder="Correo electrónico" required>

<input type="text" name="Telefono" placeholder="Teléfono">

<textarea name="Tipo de tutor" placeholder="¿Qué tipo de tutor necesitas?" required></textarea>

<textarea name="Descripcion" placeholder="Describe exactamente para qué necesitas el tutor"></textarea>

<button type="submit">Enviar solicitud</button>

</form>

</div>
<script>
function enviarFormulario(){

const nombre = document.getElementById("nombre").value;
const correo = document.getElementById("correo").value;
const telefono = document.getElementById("telefono").value;
const tipo = document.getElementById("tipo").value;
const descripcion = document.getElementById("descripcion").value;

const mensaje = `
Nombre: ${nombre}
Correo: ${correo}
Teléfono: ${telefono}
Tipo de tutor: ${tipo}
Descripción: ${descripcion}
`;

const mailto = `mailto:magicbankia@gmail.com?subject=Solicitud Tutor&body=${encodeURIComponent(mensaje)}`;

window.location.href = mailto;
}
</script>
  <script>
function enviarWhatsApp(){

const nombre = document.getElementById("nombre").value;
const correo = document.getElementById("correo").value;
const telefono = document.getElementById("telefono").value;
const tipo = document.getElementById("tipo").value;
const descripcion = document.getElementById("descripcion").value;

const mensaje = `Hola MagicBank, quiero crear un tutor:

Nombre: ${nombre}
Correo: ${correo}
Teléfono: ${telefono}
Tipo: ${tipo}
Descripción: ${descripcion}`;

const url = `https://wa.me/573112711772?text=${encodeURIComponent(mensaje)}`;

window.open(url, "_blank");
}
  </script>
  <button onclick="enviarWhatsApp()">Enviar por WhatsApp</button>
  <button onclick="enviarFormulario()">Enviar solicitud</button>
</body>
</html>
